<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>发个东西 - 局域网传输工具</title>
  <meta name="description" content="一个简单易用的局域网文件传输工具，基于WebRTC实现点对点连接，支持文本和文件快速传输，无需中转服务器，安全高效。" />
  <!-- <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet"> -->
  <link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
  <link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/inter-ui/3.19.3/inter.min.css">
  <script src="https://cdn.bootcdn.net/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script>
    (function() {
      var t = localStorage.getItem('theme');
      if (t) document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
  <script src="./xchatuser.js?v=23"></script>
  <link rel="stylesheet" href="./style.css?v=23">
</head>
<body>
  <div class="dragtip">
    <div class="dragtip-content">
      <svg viewBox="0 0 24 24" width="48" height="48" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
        <polyline points="17 8 12 3 7 8"></polyline>
        <line x1="12" y1="3" x2="12" y2="15"></line>
      </svg>
      <h1>松开发送文件</h1>
    </div>
  </div>

  <div class="app-container">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="logo">
          <img src="./favicon1.ico" alt="logo" width="24" height="24">
          <span>发个东西</span>
        </div>
        <button class="icon-btn mobile-only" id="closeSidebar">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>
      <div class="sidebar-content">
        <div class="section-title">在线用户</div>
        <ul id="users" class="user-list"></ul>
      </div>
      <div class="sidebar-footer">
        <button class="action-btn create-room-btn" title="创建房间">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
          <span>创建房间</span>
        </button>
        <a href="https://github.com/sunzsh/internal-chat" target="_blank" rel="noopener noreferrer" class="github-link" title="GitHub 项目地址">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
            <path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/>
          </svg>
          <span>GitHub</span>
        </a>
      </div>
    </aside>

    <main class="main-chat">
      <header class="chat-header">
        <div class="header-left">
          <button class="icon-btn mobile-only" id="menuBtn">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="3" y1="12" x2="21" y2="12"></line>
              <line x1="3" y1="6" x2="21" y2="6"></line>
              <line x1="3" y1="18" x2="21" y2="18"></line>
            </svg>
          </button>
          <div class="room-info">
            <h2 id="roomTitle">内网频道</h2>
          </div>
        </div>
        <div class="header-right">
          <button class="theme-toggle" id="themeToggle" title="切换主题">
            <svg class="icon-sun" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="5"></circle>
              <line x1="12" y1="1" x2="12" y2="3"></line>
              <line x1="12" y1="21" x2="12" y2="23"></line>
              <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
              <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
              <line x1="1" y1="12" x2="3" y2="12"></line>
              <line x1="21" y1="12" x2="23" y2="12"></line>
              <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
              <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
            </svg>
            <svg class="icon-moon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
            </svg>
          </button>
          <button class="icon-btn qrcode-btn" id="qrcodeBtn" title="扫码访问">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="2" y="2" width="8" height="8" rx="1"></rect>
              <rect x="14" y="2" width="8" height="8" rx="1"></rect>
              <rect x="2" y="14" width="8" height="8" rx="1"></rect>
              <rect x="14" y="14" width="4" height="4"></rect>
              <line x1="22" y1="14" x2="22" y2="14.01"></line>
              <line x1="22" y1="18" x2="22" y2="22"></line>
              <line x1="18" y1="22" x2="18" y2="22.01"></line>
              <line x1="14" y1="22" x2="14" y2="22.01"></line>
            </svg>
          </button>
          <button class="icon-btn nickname-btn" title="设置昵称">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
              <circle cx="12" cy="7" r="4"></circle>
            </svg>
          </button>
        </div>
      </header>

      <div class="chat-wrapper" id="chatWrapper"></div>

      <footer class="chat-input-area">
        <div class="input-container">
          <button class="icon-btn file-btn" title="发送文件">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path>
            </svg>
          </button>
          <textarea id="messageInput" placeholder="输入消息..." onkeydown="enterTxt(event)"></textarea>
          <button class="send-btn" id="sendBtn" title="发送消息">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="22" y1="2" x2="11" y2="13"></line>
              <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
            </svg>
          </button>
        </div>
      </footer>
    </main>
  </div>

  <div class="mobile-overlay" id="mobileOverlay"></div>


  <div class="modal" id="userSelectModal">
    <div class="modal-content">
      <h3>选择接收用户</h3>
      <div class="user-list" id="userSelectList">
      </div>
      <div class="progress-container" style="display: none;">
        <div class="progress-text">正在发送...</div>
        <div class="progress-bar">
          <div class="progress-bar-inner"></div>
        </div>
      </div>
      <div class="modal-footer">
        <button onclick="cancelSendFile()">取消</button>
        <button onclick="confirmSendFile()">发送</button>
      </div>
    </div>
  </div>

  <div class="modal" id="nicknameModal">
    <div class="modal-content">
      <h3>设置昵称</h3>
      <div class="nickname-input-container">
        <input type="text" id="nicknameInput" maxlength="10" placeholder="请输入昵称（最多10个字符）">
      </div>
      <div class="modal-footer">
        <button onclick="closeNicknameModal()">取消</button>
        <button onclick="saveNickname()">保存</button>
      </div>
    </div>
  </div>

  <div class="modal" id="passwordModal">
    <div class="modal-content">
      <h3>请输入房间密码</h3>
      <div class="nickname-input-container">
        <input type="password" id="roomPasswordInput" placeholder="请输入密码" autocomplete="off" name="password_fake">
      </div>
      <div class="modal-footer">
        <button onclick="submitRoomPassword()">确认</button>
      </div>
    </div>
  </div>

  <div class="modal" id="createRoomModal">
    <div class="modal-content">
      <h3>创建房间</h3>
      <div class="nickname-input-container">
        <input type="text" id="newRoomIdInput" maxlength="32" placeholder="请输入房间号（2-32个字符）">
      </div>
      <div class="nickname-input-container">
        <input type="password" id="newRoomPwdInput" maxlength="32" placeholder="请输入房间密码" autocomplete="off" name="password_fake_2">
      </div>
      <div class="nickname-input-container">
        <input type="password" id="newRoomPwdConfirmInput" maxlength="32" placeholder="请再次输入密码" autocomplete="off" name="password_fake_3">
      </div>
      <div class="create-room-result" id="createRoomResult" style="display:none;">
        <div class="result-label">房间创建成功！</div>
        <div class="result-url-wrapper">
          <div class="result-url"></div>
          <button class="copy-url-btn" onclick="copyRoomUrl()" title="复制链接">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
              <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
            </svg>
          </button>
        </div>
      </div>
      <div class="modal-footer">
        <button onclick="closeCreateRoomModal()">取消</button>
        <button onclick="submitCreateRoom()">创建</button>
      </div>
    </div>
  </div>

  <div class="modal" id="qrcodeModal">
    <div class="modal-content">
      <h3>扫码访问</h3>
      <div class="qrcode-container">
        <div id="qrcode"></div>
        <p class="qrcode-hint">使用手机浏览器扫描二维码即可访问</p>
        <div class="qrcode-url" id="qrcodeUrl"></div>
        <button class="copy-url-btn qrcode-copy-btn" onclick="copyQrcodeUrl()" title="复制链接">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
          </svg>
          <span>复制链接</span>
        </button>
      </div>
      <div class="modal-footer">
        <button onclick="closeQrcodeModal()">关闭</button>
      </div>
    </div>
  </div>

  <script src="./index.js?v=23"></script>
</body>
</html>
